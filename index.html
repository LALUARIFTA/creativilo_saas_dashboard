<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Creativilo — interactive SaaS dashboard template built with vanilla JS + Tailwind CSS." />
  <title>Creativilo — Interactive SaaS Dashboard</title>

  <!-- ponytail: Tailwind via CDN keeps zero build config; swap to @tailwindcss/vite when you need purged/production CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              lime: '#6cc61c',
              limeDark: '#56a710',
              limeSoft: '#eefbe0',
              limePill: '#76d327',
              darkPanel: '#313931',
              darkCard: '#3b443b',
              darkInner: '#262e26',
              cream: '#f3efe6',
              canvas: '#f7f8fa',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- App styles (relative path so GitHub Pages project URLs work) -->
  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body class="p-0 sm:p-4 md:p-6">
  <div id="app"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
